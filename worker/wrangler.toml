name = "chi-permits-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

[triggers]
crons = ["0 6 * * *"]  # 6 AM UTC daily — rebuild profiles + license cache

[[kv_namespaces]]
binding = "CACHE"
id = "ef1c7094f8ec473aa1d1a00a63a392b3"
preview_id = "3c2c6bb057214491b8c30d7d0ff609de"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "chi-permits-photos"

[[durable_objects.bindings]]
name = "LIST_ROOM"
class_name = "ListRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ListRoom"]

[vars]
SOCRATA_DOMAIN = "data.cityofchicago.org"
DATASET_ID = "ydr8-5enu"
# Comma-separated. The FIRST entry is the default returned to any caller that
# sends no Origin, so production must stay first. localhost:8791 is here so a
# local preview of a test branch exercises the REAL API instead of silently
# falling back to the stale bundled JSON — without it, every Worker call from a
# local page is blocked by CORS and only the direct-Socrata map still works.
ALLOWED_ORIGIN = "https://dkaruri.github.io,http://localhost:8791"
